## Core

build: scripts/build
#? build and install the binary

todo: go run . "$@"
#? run the CLI without building

run: go run . "$@"
#? run the CLI without building

## Testing & Linting

test: go test ./... "$@"
#? run tests

coverage: go test ./cmd ./internal/store ./internal/task -cover
#? run tests with coverage

fmt: gofmt -w .
#? format code

vet: go vet ./...
#? check for suspicious code patterns and likely mistakes

check:
  gofmt -w .
  go vet ./...
  go test ./...
#? format, vet, and test everything

## Dependencies

tidy: go mod tidy
#? clean up and sync dependencies

verify: go mod verify
#? verify dependencies match checksums

## Documentation

vhs: vhs "support/vhs/$1.tape" --output "support/vhs/$1.gif"
#? generate the vhs gif
#$ TAPE

vhs-all: for tape in support/vhs/[!_]*.tape; do vhs "$tape" --output "${tape%.tape}.gif"; done
#? generate all vhs gifs
